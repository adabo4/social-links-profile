<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="style.css">
  <title>Social Links Profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 36%, 95%);
    }
  </style>
</head>

<body>

  <article class="card">

    <img src="assets/images/avatar-jessica.jpeg" class="profile-pic" alt="Avatar">
    <div class="name-location">
      <p class="title">Jessica Randall</p>
      <p class="description">London, United Kingdom</p>
    </div>
    <h2 class="bio">"Front-end developer and avid reader."</h2>


    <div class="links">
      <a href="">Github</a>
      <a href="">Frontend Mentor</a>
      <a href="">LinkedIn</a>
      <a href="">Twitter</a>
      <a href="">Instagram</a>
    </div>
  </article>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Adriana Bohunicka</a>.
  </footer>
</body>

</html>
